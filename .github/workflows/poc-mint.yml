name: PoC — mint broker token

# Feature-branch only PoC probe. See docs/INITIAL.md Step 5.
# MUST be removed from the workflow before merging to the default branch.
on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  probe:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: PoC — mint token via broker
        run: |
          set -euo pipefail
          ID_TOKEN=$(curl -sf --max-time 15 \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=poc-broker" | jq -r .value)
          echo "Got ID token, length: ${#ID_TOKEN}"
          RESP=$(curl -sf --max-time 15 -X POST "$BROKER_URL/mint" \
            -H 'Content-Type: application/json' \
            -H 'ngrok-skip-browser-warning: true' \
            -d "{\"jwt\":\"${ID_TOKEN}\"}")
          echo "$RESP" | jq -r .expires_in   # sanity check only, never echo the token
        env:
          BROKER_URL: ${{ secrets.POC_BROKER_URL }}
